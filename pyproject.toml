[project]
name = "ai-agent-hunting"
version = "0.2.0"
description = "PEAK Assistant (Prepare) + deterministic hunt (Execute) + decision-support recommendations (Act)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    # PEAK Assistant (Cisco Talos, MIT). Pinned to a commit; it ships no PyPI release.
    "peak-assistant @ git+https://github.com/Cisco-Talos/PEAK-Assistant@dfabbb0fbcc27292ecbb8e32beeccda372bc0783",
]

[project.scripts]
hunting = "hunting.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".claude", "artifacts", "docs/archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
